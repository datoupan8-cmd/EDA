name: Team module contracts
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: ['integration/component-pin', 'feature/component-*', 'feature/pin-*', 'feature/wire-*', 'feature/hypergraph-*', 'feature/net-lines-*', 'feature/network-*']
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch L45 test checkpoint
        shell: bash
        run: |
          checkpoint=models/pin/l45_rc_pair/best.pt
          if git ls-files --error-unmatch "$checkpoint" >/dev/null 2>&1; then
            git lfs pull --include="$checkpoint" --exclude=""
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q pcb tools
      - name: Dataset-free module and parity tests
        run: python tools/run_team_tests.py
      - name: Check module ownership for a module PR
        if: github.event_name == 'pull_request'
        env:
          MODULE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$MODULE_BRANCH" in
            feature/network-metrics-split) owner=integration; network=1 ;;
            feature/hypergraph-*) owner=net_hypergraph; network=1 ;;
            feature/net-lines-*) owner=net_lines; network=1 ;;
            feature/wire-*) owner=wire; network=1 ;;
            feature/network-*) owner=network; network=1 ;;
            feature/component-*) owner=component ;;
            feature/pin-*) owner=pin ;;
            *) exit 0 ;;
          esac
          if [ "${network:-0}" = 1 ]; then
            python tools/check_network_change_scope.py --owner "$owner" --base "$BASE_SHA"
          else
            python tools/check_module_scope.py --owner "$owner" --base "$BASE_SHA" --branch
          fi
